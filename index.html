box.innerHTML=R.slice(0,8).map(r=>`<a href="${r.h}" onclick="$('#gsr').style.display='none';$('#gs').value=''">${r.n}<br><small style="opacity:.6">${r.t}</small></a>`).join('')||'<a>لا نتائج</a>';

/* ===== تصدير PDF احترافي حقيقي: Header/Footer ثابتان ومتكرران، ترقيم صفحات، Landscape تلقائي، من نفس بيانات الجدول المعروض ===== */
async function pdfExport(title,sub,fname){
if(!window.html2canvas||!window.jspdf){toast('تعذّر تحميل مكتبة PDF — تأكد من الاتصال بالإنترنت',1);return}
const table=$('#rt');if(!table)return toast('لا يوجد جدول لتصديره',1);
const rows=[...table.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim()));
if(rows.length<2)return toast('لا توجد بيانات لتصديرها',1);
const head=rows[0],totals=rows[rows.length-1],body=rows.slice(1,-1);
const land=head.length>=6,pw=land?297:210,ph=land?210:297,MM=3.7795275591,margin=10;
const pxW=Math.round(pw*MM),pxH=Math.round(ph*MM),cw=pxW-2*margin*MM,availH=pxH-2*margin*MM;
const sumCards=totals.map((v,i)=>[head[i],v]).filter(x=>x[0]&&/[0-9]/.test(x[1]));
toast('جارٍ تجهيز PDF...');
const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;background:#fff;color:#111';document.body.appendChild(host);
const th=h=>`<th style="background:#1b3654;color:#fff;padding:7px 9px;text-align:right;font-size:11px;white-space:nowrap">${esc(h)}</th>`;
function shell(bodyHtml,isFirst,no,tot){return`<div style="width:${cw}px;padding:${margin*MM}px;font-family:Cairo,Tahoma,Arial;box-sizing:border-box;color:#111">
<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c9a24b;padding-bottom:8px;margin-bottom:10px">
<div style="display:flex;gap:8px;align-items:center"><span style="font-size:24px">👑</span><div><div style="font-weight:800;font-size:15px;color:#1b3654">حمام التلات</div><div style="font-size:10px;color:#555">نظام إدارة المشتريات والمخزون</div></div></div>
<div style="text-align:left;font-size:10px;color:#555">112 شارع مصطفى النحاس – أول كوبري المنهل<br>01035145828</div></div>
${isFirst?`<div style="font-size:18px;font-weight:800;color:#1b3654;margin-bottom:3px">${esc(title)}</div>${sub?`<div style="font-size:11px;color:#555;margin-bottom:10px">${esc(sub)}</div>`:''}
${sumCards.length?`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">${sumCards.map(c=>`<div style="flex:1;min-width:110px;border:1px solid #e2dede;border-radius:8px;padding:8px 10px"><div style="font-size:10px;color:#666">${esc(c[0])}</div><div style="font-size:14px;font-weight:800;color:#1b3654">${esc(c[1])}</div></div>`).join('')}</div>`:''}`:''}
${bodyHtml}
<div style="border-top:2px solid #c9a24b;margin-top:14px;padding-top:6px;display:flex;justify-content:space-between;font-size:9px;color:#666">
<span>حمام التلات — نظام إدارة المشتريات والمخزون</span><span>تاريخ الإصدار: ${today()}</span><span>صفحة ${no} من ${tot}</span></div></div>`}
host.innerHTML=shell(`<table style="width:100%;border-collapse:collapse"><thead><tr>${head.map(th).join('')}</tr></thead><tbody><tr>${head.map(()=>`<td style="padding:7px 9px;font-size:11px">x</td>`).join('')}</tr></tbody></table>`,true,1,1);
const rowH=host.querySelector('tbody tr').getBoundingClientRect().height||22;
const chromeH=host.firstElementChild.getBoundingClientRect().height-rowH;
const perPage=Math.max(6,Math.floor((availH-chromeH)/rowH)-1);
const chunks=[];for(let i=0;i<body.length;i+=perPage)chunks.push(body.slice(i,i+perPage));
if(!chunks.length)chunks.push([]);
const totalPages=chunks.length;
const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});
for(let i=0;i<totalPages;i++){
const trs=chunks[i].map(r=>`<tr>${r.map((c,ci)=>`<td style="padding:7px 9px;font-size:11px;border-bottom:1px solid #eee;text-align:${ci>=r.length-2?'left':'right'}">${esc(c)}</td>`).join('')}</tr>`).join('');
const totRow=i==totalPages-1?`<tr style="font-weight:800;background:#f4efe3">${totals.map(c=>`<td style="padding:7px 9px;font-size:11px">${esc(c)}</td>`).join('')}</tr>`:'';
const tableHtml=`<table style="width:100%;border-collapse:collapse"><thead><tr>${head.map(th).join('')}</tr></thead><tbody>${trs||`<tr><td colspan="${head.length}" style="padding:14px;text-align:center;font-size:11px;color:#888">لا توجد بيانات</td></tr>`}${totRow}</tbody></table>`;
host.innerHTML=shell(tableHtml,i==0,i+1,totalPages);
const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#fff'});
if(i>0)doc.addPage();
doc.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,ph);
}
document.body.removeChild(host);
doc.save(fname+'.pdf');toast('تم تصدير PDF بنجاح')}

else if(r=='pay'){ti='الدفعات حسب طريقة الدفع';const G={};L.filter(t=>t.type=='payment'||t.type=='advance').forEach(t=>{const k=t.method||'أخرى';G[k]=G[k]||[0,0];G[k][0]+=t.amount;G[k][1]++});

else if(r=='mon'){ti='التقرير الشهري';const M={};L.forEach(t=>{const m=t.date.slice(0,7),o=M[m]=M[m]||{pu:0,pa:0,re:0,sh:0,ex:0,pd:0,ni:0,np:0},A=t.amount;
if(t.type=='invoice'){o.pu+=A;o.ni++}else if(t.type=='payment'||t.type=='advance'){o.pa+=A;o.np++}else if(t.type=='return')o.re+=A;else if(t.type=='shortage')o.sh+=A;else if(t.type=='extra')o.ex+=A;else if(t.type=='pd_sup')o.pd+=A;else if(t.type=='pd_shop')o.pd-=A});
const ks=Object.keys(M).sort().reverse();b=`<table id="rt"><tr><th>الشهر</th><th>المشتريات</th><th>عن الشهر السابق</th><th>المدفوعات</th><th>المرتجعات</th><th>الفواقص</th><th>الزيادات</th><th>فروق الأسعار</th><th>فواتير</th><th>دفعات</th></tr>${ks.map((k,i)=>{const o=M[k],p=M[ks[i+1]];return tr(k,F(o.pu),p&&p.pu?Math.round((o.pu-p.pu)/p.pu*100)+'%':'—',F(o.pa),F(o.re),F(o.sh),F(o.ex),F(o.pd),o.ni,o.np)}).join('')||'<tr><td colspan=10>لا توجد بيانات.</td></tr>'}</table><p>عدد الموردين النشطين: ${Object.values(D.suppliers).filter(s=>!s.arch).length}</p>`}
else if(r=='bal'){ti='الموردين حسب الرصيد';const X=Object.values(D.suppliers).filter(s=>!sid||s.id==sid).map(s=>[s,bal(s.id)]).sort((x,y)=>y[1]-x[1]);
b=`<table id="rt"><tr><th>المورد</th><th>الهاتف</th><th>الرصيد</th><th>الاتجاه</th></tr>${X.map(x=>tr(esc(x[0].name),esc(x[0].phone),F(Math.abs(x[1])),balTxt(x[1])[0])).join('')}<tr style="font-weight:bold"><td colspan=2>صافي المستحق</td><td class="n">${F(Math.abs(sum(X,x=>x[1])))}</td><td>${balTxt(sum(X,x=>x[1]))[0]}</td></tr></table>`}
else if(r=='due'){ti='تقرير المتأخرات';const X=act().filter(t=>t.type=='invoice'&&t.due&&t.due<today()&&(!sid||t.sid==sid)).map(t=>[t,idue(t).due]).filter(x=>x[1]>0).sort((x,y)=>x[0].due<y[0].due?-1:1);
b=`<table id="rt"><tr><th>المورد</th><th>الفاتورة</th><th>الاستحقاق</th><th>المتبقي</th></tr>${X.map(x=>tr(sn(x[0].sid),x[0].no,x[0].due,F(x[1]))).join('')||'<tr><td colspan=4>لا توجد متأخرات.</td></tr>'}<tr style="font-weight:bold"><td colspan=3>الإجمالي</td><td class="n">${F(sum(X,x=>x[1]))}</td></tr></table>`}
else{ti='';b=''}
